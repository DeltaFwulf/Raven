# Demo run input file

runtime:
  tf: 10000.0 #350000.0
  dt: 1.0
  dt_store: 40.0 # store points every dt_store seconds, reduces storage requirements without affecting accuracy
  root_frame: 'earth/inertial' # results are presented in this frame

bodies:

  earth:
    type: 0
    planet: 'earth'
    x: [0.0, 0.0, 0.0]
    v: [0.0, 0.0, 0.0]
    az: 0.0 # rotation about axis relative to PCI axes (0, 2*pi)

  moon:
    type: 0
    planet: 'luna'
    x: [362.6e+6, 0.0, 0.0]
    v: [0.0, 1022.0, 0.0]
    az: 0.0

