# Demo run input file

runtime:
  tf: 10000.0
  dt: 1.0
  dt_store: 10.0 # store points every dt_store seconds, reduces storage requirements without affecting accuracy

bodies:

  earth:
    type: 0
    parent: 'universal'
    planet: 'earth'
    x: [0.0, 0.0, 0.0]
    v: [0.0, 0.0, 0.0]
    az: 0.0 # rotation about axis relative to PCI axes (0, 2*pi)

