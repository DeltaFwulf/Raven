# Demo run input file

runtime:
  tf: 1.0e+6
  dt: 10.0
  root_frame: 'earth/inertial' # results are presented in this frame
  atol: 1.0e-6
  rtol: 1.0e-12
  # hmax: 100.0 # uncomment to enforce a maximum timestep

bodies:

  earth:
    type: 0
    planet: 'earth'
    parent: 'universal'
    q: [1.0, 0.0, 0.0, 0.0] # orientation relative to inertial frame

  moon:
    type: 0
    planet: 'luna'
    parent: 'earth/inertial'
    orbit: [362.6e+6, 0.0549, 5.145, 90.0, 0.0, 110.2] # set like this so inclination is right
    q: [1.0, 0.0, 0.0, 0.0]

  rocket:
    type: 1
    parent: 'earth/inertial'
    orbit: [6.5e+6, 0.9716, 5.145, 90.0, 0.0, 0.0]
    q: [1.0, 0.0, 0.0, 0.0]
    omega: [0.0, 0.0, 0.0]
    m: 1000.0
    I: [1000.0, 1000.0, 1000.0]

