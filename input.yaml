  #   q: [0.0, 1.0, 0.0, 0.0]
  #   omega: [0.0, 0.0, 0.0]
  #   m: 1000.0
  #   I: [1000.0, 1000.0, 1000.0]

  rocket2:
    type: 1
    x: [0.0, -6500000.0, 0.0]
    v: [10985.0, 0.0, 0.0]
