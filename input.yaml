# Demo run input file

runtime:
  tf: 600000.0
  dt: 10.0
  # dt_store: 50.0 # store points every dt_store seconds, reduces storage requirements without affecting accuracy
  root_frame: 'earth/inertial' # results are presented in this frame
  atol: 1.0e-6
  rtol: 1.0e-9

bodies:

  earth:
    type: 0
    planet: 'earth'
    x: [0.0, 0.0, 0.0]
    v: [0.0, 0.0, 0.0]
    az: 0.0 # rotation about axis relative to PCI axes (0, 2*pi)

  moon:
    type: 0
    planet: 'luna'
    x: [382.7e+6, 40.2e+6, 0.0]
    v: [-106.8, 1016.0, 0.0]
    az: 0.0

  # rocket:
